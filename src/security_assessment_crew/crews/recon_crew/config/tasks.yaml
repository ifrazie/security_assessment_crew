scan_ip_task:
  description: >
    Conduct a port scan of {ip_address}
    Make sure you find any interesting and relevant information given.
  expected_output: >
    Results of an Nmap scan of {ip_address} to determine open ports and 
    services in JSON format.
  agent: cybersecurity_analyst
  output_file: output/nmap_scan.json

create_report_task:
  description: >
    Write a report on the security posture of {ip_address}
    Make sure you include all relevant information in Markdown format.
  expected_output: >
    A detailed report on the security posture of {ip_address}.
  agent: technical_analyst
  context: 
    - scan_ip_task
  output_file: output/security_report.md